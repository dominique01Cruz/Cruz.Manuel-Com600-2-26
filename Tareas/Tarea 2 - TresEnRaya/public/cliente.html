<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en Raya WebSocket</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f4f8; }
        h1 { color: #333; }
        #estado { font-size: 18px; min-height: 26px; margin: 12px 0; color: #555; }
        #tablero {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            gap: 6px;
            justify-content: center;
            margin: 10px auto;
        }
        .celda {
            width: 110px;
            height: 110px;
            background: #fff;
            border: 2px solid #999;
            border-radius: 8px;
            font-size: 48px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            color: #333;
        }
        .celda:hover { background: #e3ecf5; }
        .celda.inactiva { cursor: default; }
        .celda.inactiva:hover { background: #fff; }
        .celda.x { color: #1976d2; }
        .celda.o { color: #d32f2f; }
        button {
            margin-top: 18px;
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #1565c0; }
    </style>
</head>
<body>
    <h1>Tres en Raya</h1>
    <p>T&uacute; eres X y el servidor juega con O.</p>
    <div id="estado">Conectando...</div>
    <div id="tablero"></div>
    <button onclick="reiniciar()">Reiniciar partida</button>

    <script>
        const socket = new WebSocket('ws://' + location.host);
        const tableroEl = document.getElementById('tablero');
        const estadoEl = document.getElementById('estado');

        let tablero = [];
        let puedeJugar = false;
        let terminado = false;
        const celdas = [];

        for (let i = 0; i < 9; i++) {
            const celda = document.createElement('div');
            celda.className = 'celda';
            celda.addEventListener('click', () => hacerJugada(i));
            tableroEl.appendChild(celda);
            celdas.push(celda);
        }

        socket.onmessage = event => {
            const datos = JSON.parse(event.data);

            if (datos.tipo === 'estado') {
                tablero = datos.tablero;
                puedeJugar = datos.turno === 'jugador';
                terminado = datos.terminado;
                renderizar(datos.resultado);
            } else if (datos.tipo === 'error') {
                estadoEl.textContent = datos.mensaje;
            }
        };

        function hacerJugada(pos) {
            if (!puedeJugar || terminado) return;
            if (tablero[pos]) return;
            socket.send(JSON.stringify({ tipo: 'jugar', pos }));
        }

        function reiniciar() {
            socket.send(JSON.stringify({ tipo: 'reiniciar' }));
        }

        function renderizar(resultado) {
            celdas.forEach((celda, i) => {
                celda.classList.remove('x', 'o', 'inactiva');
                const valor = tablero[i];
                celda.textContent = valor || '';
                if (valor) celda.classList.add(valor === 'X' ? 'x' : 'o');
                if (!puedeJugar || terminado || valor) celda.classList.add('inactiva');
            });

            if (terminado) {
                if (resultado === 'ganaste') estadoEl.textContent = 'Felicidades, ganaste';
                else if (resultado === 'perdiste') estadoEl.textContent = 'Te gano el servidor';
                else estadoEl.textContent = 'Empate';
            } else {
                estadoEl.textContent = puedeJugar ? 'Tu turno (X)' : 'Turno del servidor...';
            }
        }
    </script>
</body>
</html>
